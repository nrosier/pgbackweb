name: Build & Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The specific commit SHA or branch name to build from (e.g., main or a feature branch)
        required: true
        default: main
      tag:
        description: The version tag for the Docker image (e.g., 1.0.0) ⚠️ Without v prefix ⚠️
        required: true
      latest:
        description: Choose "yes" to also tag the image as "latest" in Docker Hub
        required: true
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  build-and-push-image:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Set tag version
        run: chmod +x ./scripts/set-version.sh && ./scripts/set-version.sh v${{ github.event.inputs.tag }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build the Docker image
        run: >
          docker build
          --tag niqck/pgbackweb:${{ github.event.inputs.tag }}
          --build-arg TARGETPLATFORM=linux/amd64
          --file docker/Dockerfile .

      - name: Push the Docker image
        run: docker push niqck/pgbackweb:${{ github.event.inputs.tag }}

      - name: Tag and push as latest
        if: ${{ github.event.inputs.latest == 'yes' }}
        run: |
          docker tag niqck/pgbackweb:${{ github.event.inputs.tag }} niqck/pgbackweb:latest
          docker push niqck/pgbackweb:latest
